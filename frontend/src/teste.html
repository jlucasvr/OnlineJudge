<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar Código</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0f14;
            --surface: #13161e;
            --border: #1f2433;
            --accent: #5bffc8;
            --accent-dim: rgba(91, 255, 200, 0.12);
            --text: #e2e8f0;
            --muted: #4a5568;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        /* glow blob */
        body::after {
            content: '';
            position: fixed;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(91, 255, 200, 0.07) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* top bar */
        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .dot.red {
            background: #ff5f57;
        }

        .dot.yellow {
            background: #febc2e;
        }

        .dot.green {
            background: #28c840;
        }

        .topbar-label {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.08em;
        }

        /* header */
        .header {
            padding: 28px 28px 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .header p {
            margin-top: 6px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        /* body */
        .body {
            padding: 20px 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* language selector */
        .lang-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-btn {
            font-family: var(--mono);
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .lang-btn:hover,
        .lang-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* textarea */
        .editor-wrap {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 240px;
            resize: vertical;
            background: #0a0c10;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            font-family: var(--mono);
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            caret-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--muted);
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 255, 200, 0.08);
        }

        /* line-count badge */
        .line-count {
            position: absolute;
            bottom: 10px;
            right: 14px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            pointer-events: none;
        }

        /* actions row */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .clear-btn {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.15s;
        }

        .clear-btn:hover {
            color: #ff6b6b;
        }

        .send-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #0a0c10;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
            box-shadow: 0 4px 24px rgba(91, 255, 200, 0.25);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(91, 255, 200, 0.35);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn svg {
            transition: transform 0.2s;
        }

        .send-btn:hover svg {
            transform: translateX(3px);
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent);
            color: #0a0c10;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 600;
            padding: 11px 24px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(91, 255, 200, 0.3);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="topbar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="topbar-label">code-submit.sh</span>
        </div>

        <div class="header">
            <h1>Enviar Código</h1>
            <p>// cole ou escreva seu código abaixo</p>
        </div>

        <div class="body">
            <div class="lang-row" id="langRow">
                <button class="lang-btn active" data-lang="JavaScript">JS</button>
                <button class="lang-btn" data-lang="Python">Python</button>
                <button class="lang-btn" data-lang="TypeScript">TS</button>
                <button class="lang-btn" data-lang="Rust">Rust</button>
                <button class="lang-btn" data-lang="Go">Go</button>
                <button class="lang-btn" data-lang="Outro">Outro</button>
            </div>

            <div class="editor-wrap">
                <textarea id="codeInput" placeholder="// seu código aqui..."></textarea>
                <span class="line-count" id="lineCount">0 linhas</span>
            </div>

            <div class="actions">
                <button class="clear-btn" id="clearBtn">↺ limpar</button>
                <button class="send-btn" id="sendBtn">
                    Enviar
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12" />
                        <polyline points="12 5 19 12 12 19" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✓ Código enviado com sucesso!</div>

    <script>
        const textarea = document.getElementById('codeInput');
        const lineCount = document.getElementById('lineCount');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toast = document.getElementById('toast');
        const langRow = document.getElementById('langRow');

        // line counter
        textarea.addEventListener('input', () => {
            const lines = textarea.value === '' ? 0 : textarea.value.split('\n').length;
            lineCount.textContent = lines + (lines === 1 ? ' linha' : ' linhas');
        });

        // language selector
        langRow.addEventListener('click', e => {
            if (!e.target.classList.contains('lang-btn')) return;
            langRow.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
        });

        // clear
        clearBtn.addEventListener('click', () => {
            textarea.value = '';
            lineCount.textContent = '0 linhas';
            textarea.focus();
        });

        // send
        sendBtn.addEventListener('click', () => {
            const code = textarea.value.trim();
            if (!code) { /* ... validação já existente ... */ return; }

            const lang = langRow.querySelector('.lang-btn.active')?.dataset.lang || 'Outro';

            // Envia para a API Python
            fetch('http://localhost:5000/enviar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lang, code })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok') {
                        showToast();
                        setTimeout(() => {
                            window.location.href = 'http://localhost:5000/sucesso'; // redireciona após 1.5s
                        }, 1500);
                    }
                })
                .catch(err => console.error('Erro ao enviar:', err));
        });

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);

        }


    </script>
</body>

</html>
