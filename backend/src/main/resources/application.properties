spring.application.name=testeSubmissao

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/onlinejudge
spring.datasource.username=postgres
spring.datasource.password=#Rezende31
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ✅ CORRIGIDO: era "update" — quando Flyway está ativo, o Hibernate NÃO deve
#    gerenciar o schema. "validate" apenas verifica se as entidades batem com o banco.
#    "update" + Flyway = conflito (Hibernate tenta alterar o que o Flyway já criou).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Formata o SQL no log (opcional, útil para debug)
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
