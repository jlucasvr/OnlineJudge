spring.application.name=testeSubmissao
server.port=8081
spring.profiles.default=local

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------
# Volume compartilhado (API + Worker montam o mesmo path)
# -------------------------------------------------------
# data/submissions/{year}/{month}/{uuid}.c
# data/testcases/{problemId}/inputs/{n}
# data/testcases/{problemId}/outputs/{n}
# data/compile-errors/{submissionId}.txt
# data/temp/exec/{submissionId}/
oj.data.root=${OJ_DATA_ROOT:/data}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Frontend / bootstrap / security
frontend.url=${FRONTEND_URL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
oj.bootstrap.worker.enabled=${OJ_BOOTSTRAP_WORKER_ENABLED:true}
oj.bootstrap.worker.username=${OJ_BOOTSTRAP_WORKER_USERNAME:}
oj.bootstrap.worker.email=${OJ_BOOTSTRAP_WORKER_EMAIL:}
oj.bootstrap.worker.password=${OJ_BOOTSTRAP_WORKER_PASSWORD:}

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-N/A}] [%X{username:-anonymous}] %logger{36} - %msg%n
