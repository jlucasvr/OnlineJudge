spring.application.name=testeSubmissao
server.port=8081

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onlinejudge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ✅ CORRIGIDO: era "update" — quando Flyway está ativo, o Hibernate NÃO deve
#    gerenciar o schema. "validate" apenas verifica se as entidades batem com o banco.
#    "update" + Flyway = conflito (Hibernate tenta alterar o que o Flyway já criou).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Formata o SQL no log (opcional, útil para debug)
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=V8gIVjJzNrPHyGtRQpvNGKCyLlv6+tY6HUbKacQi9+w=
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Submission code storage
oj.submissions.storage-root=${OJ_SUBMISSIONS_STORAGE_ROOT:./storage/submissions}
